<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<meta name="theme-color" content="#0f0f1a">
<title>Snake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
    gap: 10px;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 10px;
    color: #4ade80;
    text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
  }
  .info {
    display: flex;
    gap: 30px;
    margin-bottom: 15px;
    font-size: 1.1rem;
  }
  .info span { color: #4ade80; font-weight: bold; }
  canvas {
    background: #1a1a2e;
    border: 2px solid #4ade80;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
    max-width: 100%;
    height: auto;
  }
  .controls {
    margin-top: 10px;
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    max-width: 400px;
  }
  .pad {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
  }
  .pad button {
    background: #1a1a2e;
    color: #4ade80;
    border: 1px solid #4ade80;
    border-radius: 8px;
    font-size: 1.5rem;
    padding: 0;
    cursor: pointer;
  }
  .pad button:active { background: #4ade80; color: #0f0f1a; }
  .pad .up    { grid-column: 2; grid-row: 1; }
  .pad .left  { grid-column: 1; grid-row: 2; }
  .pad .pause { grid-column: 2; grid-row: 2; font-size: 1rem; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .down  { grid-column: 2; grid-row: 3; }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }
  .overlay.active { display: flex; }
  .overlay h2 { font-size: 2.5rem; color: #f87171; }
  .overlay p { font-size: 1.2rem; }
  button {
    background: #4ade80;
    color: #0f0f1a;
    border: none;
    padding: 12px 24px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(74, 222, 128, 0.6);
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="info">
    <div>Score: <span id="score">0</span></div>
    <div>Highscore: <span id="highscore">0</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="pad" id="pad">
    <button class="up"    data-dir="up">&uarr;</button>
    <button class="left"  data-dir="left">&larr;</button>
    <button class="pause" data-dir="pause">II</button>
    <button class="right" data-dir="right">&rarr;</button>
    <button class="down"  data-dir="down">&darr;</button>
  </div>
  <div class="controls">
    Wischen oder Buttons zum Steuern &middot; Pfeiltasten / WASD am Desktop
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">Game Over</h2>
    <p>Score: <span id="finalScore">0</span></p>
    <button id="restart">Nochmal spielen</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highscoreEl = document.getElementById('highscore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const finalScore = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restart');

  const GRID = 20;
  const CELLS = canvas.width / GRID;
  const TICK_MS = 100;

  let snake, dir, nextDir, food, score, highscore, running, paused, lastTick;

  highscore = parseInt(localStorage.getItem('snake-highscore') || '0', 10);
  highscoreEl.textContent = highscore;

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    scoreEl.textContent = score;
    placeFood();
    running = true;
    paused = false;
    overlay.classList.remove('active');
    lastTick = performance.now();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS),
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function step() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {
      return gameOver();
    }
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    running = false;
    if (score > highscore) {
      highscore = score;
      localStorage.setItem('snake-highscore', highscore);
      highscoreEl.textContent = highscore;
      overlayTitle.textContent = 'Neuer Highscore!';
    } else {
      overlayTitle.textContent = 'Game Over';
    }
    finalScore.textContent = score;
    overlay.classList.add('active');
  }

  function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID, 0);
      ctx.lineTo(i * GRID, canvas.height);
      ctx.moveTo(0, i * GRID);
      ctx.lineTo(canvas.width, i * GRID);
      ctx.stroke();
    }

    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
    });

    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSE', canvas.width/2, canvas.height/2);
    }
  }

  function loop(now) {
    if (running && !paused && now - lastTick >= TICK_MS) {
      step();
      lastTick = now;
    }
    draw();
    requestAnimationFrame(loop);
  }

  const KEYS = {
    ArrowUp: {x: 0, y: -1}, w: {x: 0, y: -1}, W: {x: 0, y: -1},
    ArrowDown: {x: 0, y: 1}, s: {x: 0, y: 1}, S: {x: 0, y: 1},
    ArrowLeft: {x: -1, y: 0}, a: {x: -1, y: 0}, A: {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0}, d: {x: 1, y: 0}, D: {x: 1, y: 0},
  };

  document.addEventListener('keydown', e => {
    if (e.key === ' ') {
      if (running) paused = !paused;
      e.preventDefault();
      return;
    }
    const d = KEYS[e.key];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
    e.preventDefault();
  });

  function setDir(name) {
    const map = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    const d = map[name];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  document.getElementById('pad').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const action = btn.dataset.dir;
    if (action === 'pause') {
      if (running) paused = !paused;
    } else {
      setDir(action);
    }
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { touchStart = null; return; }
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 'right' : 'left');
    } else {
      setDir(dy > 0 ? 'down' : 'up');
    }
    touchStart = null;
    e.preventDefault();
  }, { passive: false });

  restartBtn.addEventListener('click', reset);

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
